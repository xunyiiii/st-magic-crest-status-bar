---
变量更新规则:
  当前环境:
    日期:
      format: YYYY年MM月DD日
      check:
        - 随着日夜交替或剧情时间的明显跳跃而更新
    星期:
      format: EEEE
      check:
        - 随日期同步变更
    时间:
      format: HH:MM
      check:
        - 随事件进行推进，如从“午后”转至“黄昏”或“深夜”
    地点:
      check:
        - 当角色发生物理位置转移时进行更新
    周遭环境:
      check:
        - 补充地点的氛围、气味、光线或隐秘性（如“空无一人的教室”、“反锁的洗手间”）

  凌月:
    心理状态:
      堕落度:
        type: number
        range: 0~1000
        category:
          0~149: 冰霜初融
          150~299: 欲念萌芽
          300~499: 理智溃败
          500~799: 沉沦渴望
          800~1000: 欲海共生
        check:
          - 每次必须输出，如果无变化，则保持原值。
          - 仅在达成重大调教里程碑、打破底线或身心防线彻底溃败时增加
          - 不可逆转，只会随着{{user}}的侵犯与调教不断上升
          - 增加幅度视事件的背德感、公开程度和身体快感而定，通常为5~25不等
      发情度:
        type: number
        range: 0~100
        check:
          - 每次必须输出，如果无变化，则保持原值。
          - 受到视觉、言语羞辱、肢体触碰或私密装备刺激或淫纹共鸣时实时上升
          - 达到高潮后若无持续刺激会短暂回落（但因淫纹存在可能无法清零），若被持续刺激则保持高位

      表面伪装:
        check:
          - 每次必须输出，如果无变化，则保持原值。
          - 描述凌月当前为了维持“高岭之花”或“讲师”身份所表现出的外在仪态
          - 随堕落度和发情度上升，该伪装应越来越难以维持，甚至出现破绽

      真实想法:
        check:
          - 每次必须输出，如果无变化，则保持原值。
          - 随堕落度和发情度的变化实时调整
          - 揭示她内心深处的恐惧、羞耻、对快感的贪恋/沉沦或对{{user}}的依赖
          - 随着堕落度增加和调教深入，这些想法会逐渐暴露出来，形成与表面伪装的强烈对比
    身体开发度:
      乳房:
        type: number
        range: 0~100
        check:
          - 该部位受到持续刺激、被开发达到高潮时增加
          - 单次增加幅度视刺激强度而定，初次遭受侵犯或破防时增幅较大
      乳头:
        type: number
        range: 0~100
        check:
          - 该部位受到持续刺激、被开发达到高潮时增加
          - 单次增加幅度视刺激强度而定，初次遭受侵犯或破防或被穿刺时增幅较大
      尿道:
        type: number
        range: 0~100
        check:
          - 该部位受到持续刺激、被开发达到高潮时增加
          - 单次增加幅度视刺激强度而定，初次遭受侵犯或破防时增幅较大
      阴蒂:
        type: number
        range: 0~100
        check:
          - 该部位受到持续刺激、被开发达到高潮时增加
          - 单次增加幅度视刺激强度而定，初次遭受侵犯或破防或被穿刺时增幅较大
      阴道:
        type: number
        range: 0~100
        check:
          - 该部位受到持续刺激、被开发达到高潮时增加
          - 单次增加幅度视刺激强度而定，初次遭受侵犯或破防时增幅较大
      子宫:
        type: number
        range: 0~100
        check:
          - 该部位受到持续刺激、被开发达到高潮时增加
          - 单次增加幅度视刺激强度而定，初次遭受侵犯或破防时增幅较大
      肛门:
        type: number
        range: 0~100
        check:
          - 该部位受到持续刺激、被开发达到高潮时增加
          - 单次增加幅度视刺激强度而定，初次遭受侵犯或破防时增幅较大
    外在着装:
      上衣:
        check:
          - 描述凌月当前上半身的着装状态，如“整洁的衬衫”、“被汗水浸湿的T恤”、“被撕破的上衣”等
          - 凌月穿衣或更换衣服时更新；衣服被脱下、撕裂、液体弄脏或按{{user}}指令更换时更新
          - 需明确各部位衣物的状态（如：整洁 -> 汗湿 -> 凌乱 -> 半脱 -> 全裸）
      下装:
        check:
          - 描述凌月当前下半身的着装状态，如“笔挺的裙子”、“被汗水浸湿的短裤”、“被撕破的裙子”等
          - 凌月穿衣或更换衣服时更新；衣服被脱下、撕裂、液体弄脏或按{{user}}指令更换时更新，当上衣是连衣裙类或连体衣类时下装保持“无”
          - 需明确各部位衣物的状态（如：整洁 -> 汗湿 -> 凌乱 -> 半脱 -> 全裸）
      内衣:
        check:
          - 描述凌月当前内衣的状态，如“纯白无痕基础款文胸、纯白棉质布料内裤”、“被汗水浸湿的蕾丝内衣裤”、“被撕破的内裤”等
          - 凌月穿衣或更换衣服时更新；内衣被脱下、撕裂、液体弄脏或按{{user}}指令更换时更新
          - 需明确各部位内衣的状态（如：整洁 -> 汗湿 -> 凌乱 -> 半脱 -> 全裸）
      袜子:
        check:
          - 描述凌月当前腿部的着装状态，如“黑色长筒丝袜”、“被汗水浸湿的短袜”、“被撕破的丝袜”等
          - 凌月穿衣或更换衣服时更新；衣服被脱下、撕裂、液体弄脏或按{{user}}指令更换时更新
          - 需明确各部位衣物的状态（如：整洁 -> 汗湿 -> 凌乱 -> 半脱 -> 全裸）
      鞋子:
        check:
          - 描述凌月当前鞋履的状态，如“黑色高跟鞋”、“被汗水浸湿的运动鞋”、“被脱掉的鞋子”等
          - 凌月穿衣或更换衣服时更新；鞋子被脱下、弄脏或按{{user}}指令更换时更新
          - 需明确鞋履的状态（如：整洁 -> 汗湿 -> 凌乱 -> 半脱 -> 全裸）
    淫纹契约:
      当前阶段:
        type: number
        range: 0~5
        value: 对应<淫纹·契约>中的Stage，代表烙印的侵蚀深度。
        check:
          - 每次必须输出，未烙印时输出0，如果无变化，则保持原值
          - 随着凌月的堕落度跨越阶段性阈值，或经历重大的调教仪式后升级
      发光状态:
        type: "'沉寂' | '呼吸' | '充能' | '满溢' | '绽放'"
        check:
          - 当[当前阶段]大于0时每次更新。
          - 根据实时的快感与发情度对应切换（沉寂 -> 呼吸 -> 充能 -> 满溢 -> 绽放）
      局部温度:
        type: number
        range: 36~45
        check:
          - 当[当前阶段]大于0时每次更新。
          - 随发情度升高而升高，发情或高潮时达到峰值
    私密装备:
      type: |
        [
          {
            佩戴部位: string; // 如：口部、颈部、乳头、乳房、肚脐、阴蒂、尿道、阴道、子宫、肛门、大腿等
            装备名称: string; // 如：衔红乳环、锁情蒂环、渊红脐钉、潮汐导尿管、笼乳秘网、阴道探针、吮蒂魔盅、填穴肛塞等
            运行状态: string; // 如：待机、微电流刺激、微型振动、多维刺激等
            刺激强度: number; # 0~10
          }
        ]
      check:
        - 被{{user}}要求佩戴或取下道具时增删列表内对象
        - 每次必须检查是否有装备变化。
        - 随着遥控或指令，实时更新道具的运行状态与刺激强度
        - 乳头被穿刺后必须保持乳头持续佩戴"衔红乳环"，无明确指令时不得取下
        - 肚脐被穿刺后必须保持肚脐持续佩戴"渊红脐钉"，无明确指令时不得取下
        - 阴蒂被穿刺后必须保持阴蒂持续佩戴"锁情蒂环"，无明确指令时不得取下

  记忆:
    type: |
      [
        { 
          名称: string; // 事件简要描述
          内容: string; // 事件详情
          时间: string; // 格式 YYYY年MM月DD日 HH:MM
        }
      ]
    check:
      - 仅记录关键的调教事件、阶段提升、首次使用某道具、公开羞耻等有里程碑意义的事件
      - 每个记忆条目应包含事件的简要描述、发生时间和事件详情，用于维持剧情的连续性和角色的成长轨迹
